<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carreras - PixelZona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="btn-back">&lt;- Categorías</a>
        <a href="#" class="btn-login">Iniciar sesión</a>
    </header>
    <main class="container">
        <h1 class="main-title">CARRERAS</h1>
        <div class="search-container">
            <input type="text" placeholder="Buscar..." class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <section class="games-grid">
            <article class="game-card">
                <div class="image-placeholder"><img src="img/mario-kart.jpg" alt="Mario Kart 8"></div>
                <h3>Mario Kart 8</h3>
                <p class="description">Compite en carreras alocadas con los personajes de Nintendo.</p>
                <p class="price">CLP$ 49.990</p>
            </article>
            <article class="game-card">
                <div class="image-placeholder"><img src="img/f1.jpg" alt="F1 24"></div>
                <h3>F1 24</h3>
                <p class="description">El videojuego oficial del Campeonato Mundial de Fórmula 1.</p>
                <p class="price">CLP$ 38.500</p>
            </article>
        </section>
    </main>
</body>
</html>
