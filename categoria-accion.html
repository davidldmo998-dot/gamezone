<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acción - PixelZona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="btn-back">&lt;- Categorías</a>
        <a href="#" class="btn-login">Iniciar sesión</a>
    </header>
    <main class="container">
        <h1 class="main-title">ACCIÓN</h1>
        <div class="search-container">
            <input type="text" placeholder="Buscar..." class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <section class="games-grid">
            <article class="game-card">
                <div class="image-placeholder"><img src="img/gta5.jpg" alt="GTA V"></div>
                <h3>GTA V</h3>
                <p class="description">Vive la vida de tres criminales muy diferentes en Los Santos.</p>
                <p class="price">CLP$ 24.990</p>
            </article>
            <article class="game-card">
                <div class="image-placeholder"><img src="img/elden-ring.jpg" alt="Elden Ring"></div>
                <h3>Elden Ring</h3>
                <p class="description">Alzaos, Sinluz, y que la gracia os guíe en las Tierras Intermedias.</p>
                <p class="price">CLP$ 42.000</p>
            </article>
        </section>
    </main>
</body>
</html>
