<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrategia - PixelZona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="btn-back">&lt;- Categorías</a>
        <a href="#" class="btn-login">Iniciar sesión</a>
    </header>
    <main class="container">
        <h1 class="main-title">ESTRATEGIA</h1>
        <div class="search-container">
            <input type="text" placeholder="Buscar..." class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <section class="games-grid">
            <article class="game-card">
                <div class="image-placeholder"><img src="img/age-of-empires.jpg" alt="Age of Empires IV"></div>
                <h3>Age of Empires IV</h3>
                <p class="description">Comanda imperios históricos y conquista campos de batalla.</p>
                <p class="price">CLP$ 28.000</p>
            </article>
            <article class="game-card">
                <div class="image-placeholder"><img src="img/starcraft.jpg" alt="StarCraft II"></div>
                <h3>StarCraft II</h3>
                <p class="description">Lidera batallas interestelares con estrategias en tiempo real.</p>
                <p class="price free">Free to Play</p>
            </article>
        </section>
    </main>
</body>
</html>
