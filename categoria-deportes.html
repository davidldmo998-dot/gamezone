<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportes - PixelZona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="btn-back">&lt;- Categorías</a>
        <a href="#" class="btn-login">Iniciar sesión</a>
    </header>
    <main class="container">
        <h1 class="main-title">DEPORTES</h1>
        <div class="search-container">
            <input type="text" placeholder="Buscar..." class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <section class="games-grid">
            <article class="game-card">
                <div class="image-placeholder"><img src="img/fifa.jpg" alt="EA Sports FC"></div>
                <h3>EA Sports FC</h3>
                <p class="description">La simulación de fútbol más realista y completa del mundo.</p>
                <p class="price">CLP$ 45.000</p>
            </article>
            <article class="game-card">
                <div class="image-placeholder"><img src="img/nba.jpg" alt="NBA 2K"></div>
                <h3>NBA 2K</h3>
                <p class="description">Siente la cultura del baloncesto al máximo nivel competitivo.</p>
                <p class="price">CLP$ 39.990</p>
            </article>
        </section>
    </main>
</body>
</html>
